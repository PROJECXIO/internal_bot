<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai_chat</title>
  </head>
  <body>
    <div id="app"></div>
		<script>
			window.csrf_token = '{{ frappe.session.csrf_token }}';
			// socketio_port is injected by Frappe (Jinja) in production.
			// parseInt(...) || 9000 is a safe no-op fallback for Vite dev server
			// where this Jinja template is not processed.
			window.socketio_port = parseInt("{{ boot.socketio_port or 9000 }}", 10) || 9000;
			// Frappe socket.io server uses per-site namespaces (/<sitename>).
			window.site_name = '{{ frappe.local.site }}';
		</script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
